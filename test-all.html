<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统测试 - 敞开心扉</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .test-pass {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #0066cc;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
        #test-output {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>敞开心扉 - 系统测试</h1>
    <p>点击下方按钮运行测试：</p>
    <button onclick="runSecurityTests()">运行安全测试</button>
    <button onclick="runFunctionalTests()">运行功能测试</button>
    <button onclick="runAllTests()">运行所有测试</button>
    
    <div id="test-output"></div>
    
    <!-- 引入测试脚本 -->
    <script src="security_test.js"></script>
    <script src="functional_test.js"></script>
    
    <script>
        // 重定向console.log到页面
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const output = document.getElementById('test-output');
            output.textContent += args.join(' ') + '\n';
        };
        
        // 运行所有测试
        function runAllTests() {
            document.getElementById('test-output').textContent = '';
            runSecurityTests();
            setTimeout(runFunctionalTests, 1000);
        }
    </script>
</body>
</html>
