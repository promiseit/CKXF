                    scenario: '主管对你说："辛苦了，今天的工作做得不错！"',
                    options: [
                        { text: '说："谢谢！我会继续努力的。"', correct: true, explanation: '这是一个谦虚且积极的回应，表达了感谢和上进心。' },
                        { text: '说："这没什么，本来就应该的。"', correct: false, explanation: '这样显得不够自信，也没有接受表扬的礼貌。' },
                        { text: '说："是啊，我也觉得自己很棒！"', correct: false, explanation: '这样显得有些自大，不够谦虚。' }
                    ]
                }
            ],
            L2: [
                {
                    scenario: '会议中，主管问："有人对这个方案有什么想法吗？"',
                    options: [
                        { text: '如果有想法就说出来，如果没有就安静坐着', correct: true, explanation: '诚实表达自己的想法是好的，但如果没有想法也不需要勉强。' },
                        { text: '不管有没有想法都要发言', correct: false, explanation: '没有想法还硬要说会浪费大家的时间。' },
                        { text: '一直低头看手机', correct: false, explanation: '这样显得不尊重会议和其他人。' }
                    ]
                }
            ],
            L3: [
                {
                    scenario: '同事请你帮忙，但你手头工作很忙。',
                    options: [
                        { text: '说："我现在手头有点忙，等我20分钟后帮你可以吗？"', correct: true, explanation: '既表达了愿意帮忙的态度，也说明了自己的情况，给了一个明确的时间。' },
                        { text: '直接拒绝说："不行，我太忙了。"', correct: false, explanation: '这样太直接了，可能会让同事感到不舒服。' },
                        { text: '勉强答应，但心里很不情愿', correct: false, explanation: '这样自己会让自己不开心，工作也可能帮不好。' }
                    ]
                }
            ],
            L4: [
                {
                    scenario: '在团队讨论中，你不同意某人的观点。',
                    options: [
                        { text: '说："我理解你的想法，不过我有不同的看法..."然后解释', correct: true, explanation: '先肯定对方，再表达自己的观点，这样更容易被接受。' },
                        { text: '直接说："你说得不对，应该是..."', correct: false, explanation: '这样太直接了，可能会让对方感到被攻击。' },
                        { text: '不说出来，但心里不同意', correct: false, explanation: '这样不利于团队沟通，问题也得不到解决。' }
                    ]
                }
            ],
            L5: [
                {
                    scenario: '工作中发现了一个严重的错误，可能会影响项目进度。',
                    options: [
                        { text: '及时向主管汇报，并说明情况和可能的影响', correct: true, explanation: '及时沟通问题是负责任的表现，可以让团队一起想办法解决。' },
                        { text: '自己悄悄解决，不说出来', correct: false, explanation: '这样风险太大，如果解决不好会造成更大的问题。' },
                        { text: '假装没看见', correct: false, explanation: '这是不负责任的表现，可能会造成严重后果。' }
                    ]
                }
            ]
        };
        
        let currentScenarioIndex = 0;
        let currentScenarios = [];
        
        function init() {
            loadSavedScore();
            initEventListeners();
            updateGame();
            loadSocialScenarios();
        }
        
        function loadSavedScore() {
            const savedScore = localStorage.getItem('score');
            const savedTodayScore = localStorage.getItem('todayScore');
            
            if (savedScore) {
                document.querySelector('.score-value').textContent = savedScore;
            }
            
            if (savedTodayScore) {
                document.querySelectorAll('.score-value')[1].textContent = savedTodayScore;
            }
        }
        
        function initEventListeners() {
            const target = document.getElementById('target');
            const checkBtn = document.getElementById('check-btn');
            const hintBtn = document.getElementById('hint-btn');
            const resetBtn = document.getElementById('reset-btn');
            const navBtns = document.querySelectorAll('.nav-btn');
            const difficultyBtns = document.querySelectorAll('.difficulty-btn');
            const nextScenarioBtn = document.getElementById('next-scenario');
            
            target.addEventListener('dragover', handleDragOver);
            target.addEventListener('drop', handleDrop);
            
            checkBtn.addEventListener('click', checkAnswer);
            hintBtn.addEventListener('click', showHint);
            resetBtn.addEventListener('click', resetGame);
            nextScenarioBtn.addEventListener('click', nextScenario);
            
            navBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    navBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentMode = this.getAttribute('data-mode');
                    updateGame();
                });
            });
            
            difficultyBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    difficultyBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentLevel = this.getAttribute('data-level');
                    document.querySelectorAll('.score-value')[2].textContent = currentLevel;
                    updateGame();
                });
            });
        }
        
        function handleDragOver(e) {
            e.preventDefault();
        }
        
        function handleDrop(e) {
            e.preventDefault();
            if (draggedElement) {
                this.appendChild(draggedElement);
                document.getElementById('feedback').textContent = '很好！继续加油';
                document.getElementById('feedback').style.color = '#333333';
            }
        }
        
        function checkAnswer() {
            const target = document.getElementById('target');
            const targetBlocks = target.querySelectorAll('.block');
            let userOrder = [];
            
            targetBlocks.forEach(block => {
                userOrder.push(block.textContent);
            });
            
            const feedback = document.getElementById('feedback');
            const correctOrder = gameContent[currentMode][currentLevel].correctOrder;
            
            if (JSON.stringify(userOrder) === JSON.stringify(correctOrder)) {
                feedback.textContent = '太棒了！回答正确！';
                feedback.style.color = '#4CAF50';
                updateScore(100);
            } else {
                feedback.textContent = '再试一次，你可以的！';
                feedback.style.color = '#FF9800';
            }
        }
        
        function showHint() {
            const feedback = document.getElementById('feedback');
            const correctSentence = gameContent[currentMode][currentLevel].correctSentence;
            feedback.textContent = '提示：正确的句子是「' + correctSentence + '」';
            feedback.style.color = '#2196F3';
        }
        
        function resetGame() {
            const blocksContainer = document.getElementById('blocks');
            const target = document.getElementById('target');
            const targetBlocks = target.querySelectorAll('.block');
            
            targetBlocks.forEach(block => {
                blocksContainer.appendChild(block);
            });
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '请将积木拖放到下方区域';
            feedback.style.color = '#333333';
        }
        
        function updateGame() {
            const gameArea = document.querySelector('.game-area');
            const socialArea = document.getElementById('social-area');
            
            if (currentMode === 'social') {
                gameArea.style.display = 'none';
                socialArea.style.display = 'block';
                loadSocialScenarios();
            } else {
                gameArea.style.display = 'block';
                socialArea.style.display = 'none';
                loadGameContent();
            }
        }
        
        function loadGameContent() {
            const content = gameContent[currentMode][currentLevel];
            const gameHeader = document.querySelector('.game-header h2');
            const gameDescription = document.querySelector('.game-header p');
            const blocksContainer = document.getElementById('blocks');
            
            gameHeader.textContent = content.title;
            gameDescription.textContent = content.description;
            
            blocksContainer.innerHTML = '';
            document.getElementById('target').innerHTML = '';
            document.getElementById('feedback').textContent = '请将积木拖放到下方区域';
            
            createBlocks(content.items);
        }
        
        function createBlocks(items) {
            const blocksContainer = document.getElementById('blocks');
            const shuffledItems = shuffleArray([...items]);
            
            shuffledItems.forEach(item => {
                const block = document.createElement('div');
                block.className = 'block';
                block.draggable = true;
                block.textContent = item;
                
                block.addEventListener('dragstart', function(e) {
                    draggedElement = this;
                    setTimeout(() => this.style.opacity = '0.5', 0);
                });
                
                block.addEventListener('dragend', function() {
                    this.style.opacity = '1';
                    draggedElement = null;
                });
                
                blocksContainer.appendChild(block);
            });
        }
        
        function loadSocialScenarios() {
            currentScenarios = socialScenarios[currentLevel] || socialScenarios.L1;
            currentScenarioIndex = 0;
            displayScenario();
        }
        
        function displayScenario() {
            const scenario = currentScenarios[currentScenarioIndex];
            document.getElementById('scenario-text').textContent = scenario.scenario;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            scenario.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.addEventListener('click', () => checkSocialAnswer(option, index));
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('explanation').style.display = 'none';
        }
        
        function checkSocialAnswer(option, index) {
            const options = document.querySelectorAll('.option-btn');
            options.forEach((btn, i) => {
                btn.disabled = true;
                if (i === index) {
                    btn.style.backgroundColor = option.correct ? '#E8F5E9' : '#FFEBEE';
                    btn.style.borderColor = option.correct ? '#4CAF50' : '#F44336';
                }
            });
            
            const explanation = document.getElementById('explanation');
            explanation.innerHTML = `
                <strong>${option.correct ? '正确！' : '再想想...'}</strong><br><br>
                ${option.explanation}
            `;
            explanation.style.display = 'block';
            explanation.style.backgroundColor = option.correct ? '#E8F5E9' : '#FFF3E0';
            explanation.style.borderLeftColor = option.correct ? '#4CAF50' : '#FF9800';
            
            if (option.correct) {
                updateScore(100);
            }
        }
        
        function nextScenario() {
            currentScenarioIndex++;
            if (currentScenarioIndex >= currentScenarios.length) {
                currentScenarioIndex = 0;
            }
            displayScenario();
        }
        
        function updateScore(points) {
            const scoreElement = document.querySelector('.score-value');
            let currentScore = parseInt(scoreElement.textContent) || 0;
            currentScore += points;
            scoreElement.textContent = currentScore;
            
            const todayScoreElement = document.querySelectorAll('.score-value')[1];
            let todayScore = parseInt(todayScoreElement.textContent) || 0;
            todayScore += points;
            todayScoreElement.textContent = todayScore;
            
            localStorage.setItem('score', currentScore.toString());
            localStorage.setItem('todayScore', todayScore.toString());
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
